<button
  type="button"
  class="{{ btn_class }}{% if product.pk in wishlist_ids %} is-active{% endif %}"
  data-wishlist-toggle
  data-product-id="{{ product.pk }}"
  aria-pressed="{% if product.pk in wishlist_ids %}true{% else %}false{% endif %}"
  aria-label="{% if product.pk in wishlist_ids %}Прибрати з улюбленого{% else %}Додати в улюблене{% endif %}"
>
  <svg width="{{ svg_size|default:16 }}" height="{{ svg_size|default:16 }}" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.3" aria-hidden="true">
    <path d="M12 20.5 4.2 12.9a4.7 4.7 0 0 1 6.6-6.7l1.2 1.1 1.2-1.1a4.7 4.7 0 0 1 6.6 6.7z"/>
  </svg>
</button>
