<div id="b2b-form">
  <p class="vv-eyebrow vv-mb-4">Заявка</p>
  <h2 class="vv-serif vv-mb-5">Надіслати запит</h2>
  <form class="vv-flex-col vv-gap-4" data-qa="lead-form" method="get" action="#">
    <div class="vv-float">
      <input class="form-control" type="text" name="company_name" id="partner-company" placeholder=" " disabled>
      <label for="partner-company">Компанія</label>
    </div>
    <div class="vv-float">
      <input class="form-control" type="text" name="contact_name" id="partner-contact" placeholder=" " disabled>
      <label for="partner-contact">Контактна особа</label>
    </div>
    <div class="vv-float">
      <input class="form-control" type="email" name="email" id="partner-email" placeholder=" " disabled>
      <label for="partner-email">Email</label>
    </div>
    <div class="vv-float">
      <input class="form-control" type="tel" name="phone" id="partner-phone" placeholder=" " disabled>
      <label for="partner-phone">Телефон</label>
    </div>
    <div class="vv-float">
      <input class="form-control" type="text" name="city" id="partner-city" placeholder=" " disabled>
      <label for="partner-city">Місто</label>
    </div>
    <div class="vv-float">
      <textarea class="form-control" name="message" id="partner-message" placeholder=" " disabled></textarea>
      <label for="partner-message">Повідомлення</label>
    </div>
    <button class="vv-submit" type="button" disabled>Надіслати</button>
  </form>
  <p class="partner-form-note">Прийом заявок підключимо на кроці партнерок (POST). Поки що напишіть на контакти.</p>
</div>
